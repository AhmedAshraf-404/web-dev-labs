<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="calculator">
    <h1>iOS Calculator</h1>
    <div id="display">0</div>

    <div class="buttons">
      <button data-action="clear" class="light">AC</button>
      <button data-num="00" class="dark">00</button>
      <button data-action="percent" class="dark">%</button>
      <button data-op="/" class="orange">÷</button>

      <button data-num="7" class="dark">7</button>
      <button data-num="8" class="dark">8</button>
      <button data-num="9" class="dark">9</button>
      <button data-op="*" class="orange">×</button>

      <button data-num="4" class="dark">4</button>
      <button data-num="5" class="dark">5</button>
      <button data-num="6" class="dark">6</button>
      <button data-op="-" class="orange">−</button>

      <button data-num="1" class="dark">1</button>
      <button data-num="2" class="dark">2</button>
      <button data-num="3" class="dark">3</button>
      <button data-op="+" class="orange">+</button>

      <button data-num="0" class="dark zero">0</button>
      <button data-action="dot" class="dark">.</button>
      <button data-action="equals" class="orange">=</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
